<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SRF - HR</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#0f172a}
body{display:flex;flex-direction:column}
button{font:inherit}

/* HEADER */
.header{height:52px;flex-shrink:0;background:#1e293b;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 9px;z-index:100}
.header-title{font-size:15px;font-weight:900}
.header-actions{display:flex;gap:5px}
.header-btn{border:0;color:#fff;padding:7px 9px;border-radius:7px;font-size:11px;font-weight:900;cursor:pointer;touch-action:manipulation}
.header-btn:disabled{opacity:.6;cursor:not-allowed}
.refresh{background:#d97706}
.camera-on{background:#16a34a}
.camera-off{background:#dc2626}
.flash-on{background:#f59e0b}
.flash-off{background:#475569}

/* STATS */
.stats{height:52px;flex-shrink:0;background:#334155;color:#fff;display:flex;justify-content:space-around;align-items:center;text-align:center}
.stat{font-size:10px;color:#cbd5e1}
.stat strong{display:block;color:#38bdf8;font-size:16px;margin-top:1px}

/* SCANNER */
.scanner{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
#reader{position:absolute;inset:0;width:100%!important;height:100%!important;border:0!important;background:#000}
#reader video{width:100%!important;height:100%!important;object-fit:cover!important}
#reader img,#reader__dashboard{display:none!important}
#reader__scan_region{width:100%!important;height:100%!important}

.detect-flash{position:absolute;inset:0;z-index:30;border:6px solid #22c55e;background:rgba(34,197,94,.25);opacity:0;pointer-events:none;transition:opacity .25s}
.detect-flash.show{opacity:1;transition:none}

.camera-off-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;background:#000;color:#64748b;font-size:14px;font-weight:800;pointer-events:none}

.status-box{position:absolute;top:12px;left:12px;right:12px;z-index:20;background:rgba(15,23,42,.88);backdrop-filter:blur(8px);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:9px;color:#fff;pointer-events:none}
.lamp{width:13px;height:13px;min-width:13px;border-radius:50%;background:#facc15;box-shadow:0 0 10px currentColor}
.status-text{font-size:13px;font-weight:800;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.notif{position:absolute;top:75px;left:50%;transform:translateX(-50%);z-index:80;padding:10px 18px;border-radius:25px;font-size:13px;font-weight:900;display:none;white-space:nowrap;box-shadow:0 5px 15px rgba(0,0,0,.35)}
.notif.success{background:#16a34a;color:#fff}
.notif.warning{background:#f59e0b;color:#fff}
.notif.error{background:#dc2626;color:#fff}

/* BOTTOM */
.bottom-actions{position:absolute;left:10px;right:10px;bottom:10px;z-index:40;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.bottom-btn{height:50px;border:0;border-radius:12px;color:#fff;background:rgba(30,41,59,.94);font-size:11px;font-weight:900;box-shadow:0 5px 14px rgba(0,0,0,.45);cursor:pointer;touch-action:manipulation;transition:.15s}
.bottom-btn.sync{background:#2563eb}
.bottom-btn.queue{background:#475569}
.bottom-btn.history{background:#475569}
.bottom-btn:active{transform:scale(.97)}
.bottom-btn:disabled{cursor:not-allowed;transform:none}
.count{display:inline-flex;min-width:20px;height:20px;padding:0 5px;align-items:center;justify-content:center;border-radius:10px;background:#dc2626;color:#fff;font-size:10px;margin-left:3px}

/* MODAL */
.modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.68);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{width:100%;max-height:82vh;background:#f8fafc;border-radius:18px 18px 0 0;overflow:hidden;display:flex;flex-direction:column}
.sheet-head{flex-shrink:0;background:#1e293b;color:#fff;padding:13px 15px;display:flex;align-items:center;justify-content:space-between}
.sheet-title{font-size:14px;font-weight:900}
.sheet-close{border:0;background:#475569;color:#fff;border-radius:8px;padding:6px 10px;font-weight:900;cursor:pointer}
.sheet-body{padding:12px;overflow:auto;-webkit-overflow-scrolling:touch}

.toolbar{display:flex;gap:7px;margin-bottom:10px}
.tool-btn{border:0;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:900;background:#e2e8f0;color:#0f172a}
.tool-btn.danger{background:#dc2626;color:#fff}
.search{width:100%;height:40px;border:1px solid #cbd5e1;border-radius:9px;padding:0 11px;margin-bottom:10px;outline:none}

.list{display:flex;flex-direction:column;gap:7px}
.item{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.item-main{min-width:0}
.item-resi{font-size:13px;font-weight:900;color:#0f172a;word-break:break-all}
.item-meta{font-size:10px;color:#64748b;margin-top:3px}
.item-delete{flex-shrink:0;border:0;background:#fee2e2;color:#b91c1c;border-radius:7px;padding:7px 9px;font-size:10px;font-weight:900}
.empty{text-align:center;color:#94a3b8;padding:28px 10px;font-size:12px;font-weight:700}

.badge{display:inline-block;padding:1px 6px;border-radius:6px;font-size:9px;font-weight:900;color:#fff;background:#64748b}
.badge.antrean{background:#f59e0b}
.badge.terkirim{background:#16a34a}
.badge.double{background:#dc2626}
.badge.invalid{background:#7c3aed}

@media(max-width:380px){
  .header-title{font-size:13px}
  .header-btn{padding:6px 7px;font-size:10px}
  .status-text{font-size:12px}
  .bottom-actions{left:7px;right:7px;gap:5px}
  .bottom-btn{height:47px;font-size:10px}
}
</style>
</head>

<body>

<header class="header">
    <div class="header-title">SRF • HR</div>
    <div class="header-actions">
        <button id="cameraToggle" class="header-btn camera-off" onclick="toggleCamera()">KAMERA OFF</button>
        <button id="flashToggle" class="header-btn flash-off" onclick="toggleFlash()" disabled>FLASH OFF</button>
        <button id="robotToggle" class="header-btn camera-on" onclick="toggleRobotVoice()">ROBOT ON</button>
        <button class="header-btn refresh" onclick="location.reload()">REFRESH</button>
    </div>
</header>

<div class="stats">
    <div class="stat">Hari Ini<strong id="hariIni">0</strong></div>
    <div class="stat">Kemarin<strong id="kemarin">0</strong></div>
    <div class="stat">Minggu Ini<strong id="mingguIni">0</strong></div>
</div>

<div class="scanner">
    <div id="reader"></div>
    <div id="detectFlash" class="detect-flash"></div>
    <div id="cameraOverlay" class="camera-off-overlay">KAMERA OFF</div>

    <div class="status-box">
        <div id="lamp" class="lamp"></div>
        <div id="statusText" class="status-text">Kamera OFF</div>
    </div>

    <div id="notif" class="notif"></div>

    <div class="bottom-actions">
        <button id="syncButton" class="bottom-btn sync" onclick="syncKeServer()">SYNC<span id="syncCount" class="count">0</span></button>
        <button class="bottom-btn queue" onclick="openQueue()">ANTREAN<span id="queueButtonCount" class="count">0</span></button>
        <button class="bottom-btn history" onclick="openHistory()">RIWAYAT</button>
    </div>
</div>

<!-- ANTREAN -->
<div id="queueModal" class="modal" onclick="closeModalOutside(event,'queueModal')">
    <div class="sheet">
        <div class="sheet-head">
            <div class="sheet-title">ANTREAN BELUM SINKRON (<span id="queueCount">0</span>)</div>
            <button class="sheet-close" onclick="closeModal('queueModal')">TUTUP</button>
        </div>
        <div class="sheet-body">
            <div class="toolbar">
                <button class="tool-btn danger" onclick="clearQueue()">KOSONGKAN ANTREAN</button>
            </div>
            <div id="queueList" class="list"></div>
        </div>
    </div>
</div>

<!-- RIWAYAT -->
<div id="historyModal" class="modal" onclick="closeModalOutside(event,'historyModal')">
    <div class="sheet">
        <div class="sheet-head">
            <div class="sheet-title">RIWAYAT HR</div>
            <button class="sheet-close" onclick="closeModal('historyModal')">TUTUP</button>
        </div>
        <div class="sheet-body">
            <input id="historySearch" class="search" type="search" placeholder="Cari nomor resi..." oninput="renderHistory()">
            <div class="toolbar">
                <button class="tool-btn danger" onclick="deleteAllHistory()">HAPUS SEMUA RIWAYAT</button>
            </div>
            <div id="historyList" class="list"></div>
        </div>
    </div>
</div>

<script src="config.js"></script>

<script>
/* =========================================================
   CONFIG
========================================================= */

const SOURCE_NAME = "hr";   // backend khusus HR; tidak memakai backend SRF Pengiriman

const ROBOT_CONFIG = {
    enabled: localStorage.getItem("srf_hr_robot") !== "off",
    bahasa: "id-ID",
    rate: 1.15,
    pitch: 1.0,
    volume: 1.0,
    pesan: {
        siap: "Kamera mati, scanner siap",
        kameraAktif: "Kamera aktif, siap scan",
        kameraBerhenti: "Kamera dimatikan",
        kameraGagal: "Tidak dapat membuka kamera",
        resiTidakDikenal: "Resi tidak dikenal",
        doubleQueue: "Resi sudah di scan, ada diantrean",
        doubleHistory: "Resi pernah di scan",
        syncMulai: "Memulai sinkronisasi",
        syncBerhasil: "resi berhasil disinkronkan",
        syncGagal: "Sinkronisasi gagal",
        antreanKosong: "Antrean kosong"
    }
};

const SCAN_CONFIG = {
    processingDelay: 400,
    beepSuccess: true,
    beepError: true,
    beepDouble: true
};

const STORAGE_QUEUE = "srf_hr_queue_v1";
const STORAGE_HISTORY = "srf_hr_history_v1";

/* =========================================================
   STATE
========================================================= */

let localData = loadJSON(STORAGE_QUEUE, []);
let scanHistory = loadJSON(STORAGE_HISTORY, []);

let html5QrCode = null;
let cameraRunning = false;
let flashOn = false;
let cameraTrack = null;
let processing = false;
let syncSedangBerjalan = false;

function loadJSON(key, fallback){
    try{
        const x = JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback));
        return Array.isArray(x) ? x : fallback;
    }catch(e){
        return fallback;
    }
}

function saveData(){
    try{
        localStorage.setItem(STORAGE_QUEUE, JSON.stringify(localData));
        localStorage.setItem(STORAGE_HISTORY, JSON.stringify(scanHistory));
    }catch(e){
        showNotif("PENYIMPANAN HP PENUH", "error");
    }
}

function getTargetUrl(){
    try{
        if(typeof APP_URL !== "undefined" && APP_URL){
            return String(APP_URL).trim();
        }
        if(typeof CONFIG !== "undefined" && CONFIG && CONFIG.APP_URL){
            return String(CONFIG.APP_URL).trim();
        }
    }catch(e){}
    return "";
}

/* =========================================================
   LOAD
========================================================= */

window.addEventListener("load", ()=>{
    updateUI();
    renderQueue();
    renderHistory();
    updateStats();
    updateFlashButton();
    updateRobotButton();
    setStatus("yellow", ROBOT_CONFIG.pesan.siap);
});

function updateUI(){
    const n = localData.length;
    document.getElementById("syncCount").innerText = n;
    document.getElementById("queueCount").innerText = n;
    document.getElementById("queueButtonCount").innerText = n;
}

/* =========================================================
   STATISTIK (dihitung dari riwayat di HP)
========================================================= */

function updateStats(){
    const now = new Date();
    const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const startYesterday = new Date(startToday); startYesterday.setDate(startYesterday.getDate() - 1);
    const startWeek = new Date(startToday);
    const dow = (startToday.getDay() + 6) % 7;      // Senin = 0
    startWeek.setDate(startWeek.getDate() - dow);

    let hari = 0, kemarin = 0, minggu = 0;

    scanHistory.forEach(x=>{
        if(x.status === "INVALID") return;
        const d = new Date(x.waktu);
        if(Number.isNaN(d.getTime())) return;
        if(d >= startToday) hari++;
        else if(d >= startYesterday) kemarin++;
        if(d >= startWeek) minggu++;
    });

    document.getElementById("hariIni").innerText = hari;
    document.getElementById("kemarin").innerText = kemarin;
    document.getElementById("mingguIni").innerText = minggu;
}

/* =========================================================
   STATUS / NOTIF / BEEP / FEEDBACK / SPEAK
========================================================= */

function setStatus(type, text){
    const lamp = document.getElementById("lamp");
    document.getElementById("statusText").innerText = text;
    const color = type==="green" ? "#22c55e" : type==="red" ? "#ef4444" : "#facc15";
    lamp.style.background = color;
    lamp.style.color = color;
}

function showNotif(text, type="success"){
    const el = document.getElementById("notif");
    el.innerText = text;
    el.className = "notif " + type;
    el.style.display = "block";
    clearTimeout(window.notifTimer);
    window.notifTimer = setTimeout(()=>{ el.style.display = "none"; }, 2500);
}

let audioCtx = null;
function beep(freq=3200, duration=.08){
    try{
        const C = window.AudioContext || window.webkitAudioContext;
        if(!audioCtx) audioCtx = new C();
        if(audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        osc.frequency.value = freq;
        osc.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }catch(e){}
}

function detectFeedback(){
    const el = document.getElementById("detectFlash");
    if(el){
        el.classList.add("show");
        setTimeout(()=>{ el.classList.remove("show"); }, 120);
    }
    if(navigator.vibrate) navigator.vibrate(60);
}

function speak(text){
    if(!ROBOT_CONFIG.enabled || !("speechSynthesis" in window)) return;
    try{
        speechSynthesis.cancel();
        const v = new SpeechSynthesisUtterance(text);
        v.lang = ROBOT_CONFIG.bahasa;
        v.rate = ROBOT_CONFIG.rate;
        v.pitch = ROBOT_CONFIG.pitch;
        v.volume = ROBOT_CONFIG.volume;
        speechSynthesis.speak(v);
    }catch(e){}
}

function updateRobotButton(){
    const btn = document.getElementById("robotToggle");
    if(!btn) return;
    if(ROBOT_CONFIG.enabled){
        btn.className = "header-btn camera-on";
        btn.innerText = "ROBOT ON";
    }else{
        btn.className = "header-btn camera-off";
        btn.innerText = "ROBOT OFF";
    }
}

function toggleRobotVoice(){
    ROBOT_CONFIG.enabled = !ROBOT_CONFIG.enabled;
    localStorage.setItem("srf_hr_robot", ROBOT_CONFIG.enabled ? "on" : "off");

    if(!ROBOT_CONFIG.enabled){
        try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){}
        showNotif("SUARA ROBOT OFF", "warning");
        setStatus("yellow", "Suara robot dimatikan");
    }else{
        showNotif("SUARA ROBOT ON", "success");
        setStatus("green", "Suara robot diaktifkan");
    }
    updateRobotButton();
}

/* =========================================================
   RESI  (aturan awalan SAMA dengan Apps Script)
========================================================= */

function normalizeResi(resi){
    return String(resi || "").trim().toUpperCase().replace(/\s+/g, "").replace(/[^A-Z0-9]/g, "");
}

function getEkspedisi(resi){
    const r = normalizeResi(resi);
    if(/^(JY|JZ|JX)/.test(r)) return "J&T";
    if(/^(CM|JNAP)/.test(r)) return "JNE";
    if(/^GTL/.test(r)) return "GTL";
    if(/^(SPXID|ID)/.test(r)) return "SPX";
    if(/^LX/.test(r)) return "LEX ID";
    return null;
}

function speakEkspedisi(e){
    return ({ "J&T":"J EN T", "SPX":"S P X", "JNE":"J N E", "GTL":"G T L", "LEX ID":"Lex I D" })[e] || e;
}

function formatDateTime(iso){
    const d = new Date(iso);
    if(Number.isNaN(d.getTime())) return "-";
    return d.toLocaleString("id-ID", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"});
}

function spokenDateTime(iso){
    const d = new Date(iso);
    if(Number.isNaN(d.getTime())) return "";
    const now = new Date();
    const time = d.toLocaleTimeString("id-ID", {hour:"2-digit", minute:"2-digit"});
    if(d.toDateString() === now.toDateString()) return `hari ini pukul ${time}`;
    const y = new Date(now); y.setDate(now.getDate() - 1);
    if(d.toDateString() === y.toDateString()) return `kemarin pukul ${time}`;
    const day = d.toLocaleDateString("id-ID", {day:"numeric", month:"long", year:"numeric"});
    return `tanggal ${day} pukul ${time}`;
}

function findQueue(resi){
    const r = normalizeResi(resi);
    return localData.some(x => normalizeResi(x) === r);
}

// Resi berstatus INVALID boleh discan ulang, jadi tidak dihitung sebagai riwayat
function findHistory(resi){
    const r = normalizeResi(resi);
    return scanHistory.find(x => normalizeResi(x.resi) === r && x.status !== "INVALID");
}

function doubleAlert(message, robotText){
    if(SCAN_CONFIG.beepDouble){
        beep(350, .08);
        setTimeout(()=>beep(250, .12), 100);
    }
    setStatus("red", message);
    showNotif(message, "error");
    speak(robotText);
}

/* =========================================================
   SIMPAN LOKAL
========================================================= */

function simpanLokal(resi){
    resi = normalizeResi(resi);
    if(!resi) return false;

    const ekspedisi = getEkspedisi(resi);

    if(!ekspedisi){
        if(SCAN_CONFIG.beepError) beep(250, .25);
        setStatus("red", ROBOT_CONFIG.pesan.resiTidakDikenal + " • " + resi);
        showNotif("RESI TIDAK DIKENAL", "error");
        speak(ROBOT_CONFIG.pesan.resiTidakDikenal);
        return false;
    }

    if(findQueue(resi)){
        doubleAlert("RESI MASIH DI ANTREAN", ROBOT_CONFIG.pesan.doubleQueue);
        return false;
    }

    const old = findHistory(resi);
    if(old){
        doubleAlert("RESI SUDAH PERNAH DI-SCAN", `${ROBOT_CONFIG.pesan.doubleHistory} ${spokenDateTime(old.waktu)}`);
        return false;
    }

    localData.push(resi);

    scanHistory.unshift({
        resi: resi,
        ekspedisi: ekspedisi,
        waktu: new Date().toISOString(),
        status: "ANTREAN"
    });
    scanHistory = scanHistory.slice(0, 5000);

    saveData();
    updateUI();
    renderQueue();
    renderHistory();
    updateStats();

    if(SCAN_CONFIG.beepSuccess) beep(3200, .08);

    setStatus("green", `${ekspedisi} • berhasil • masuk antrean`);
    showNotif("RESI MASUK ANTREAN", "success");
    speak(speakEkspedisi(ekspedisi));

    return true;
}

/* =========================================================
   KAMERA
========================================================= */

async function toggleCamera(){
    if(cameraRunning) await stopCamera();
    else await startCamera();
}

async function startCamera(){
    if(cameraRunning) return;

    const btn = document.getElementById("cameraToggle");
    const overlay = document.getElementById("cameraOverlay");

    setStatus("yellow", "Menyalakan kamera...");
    btn.disabled = true;

    try{
        if(!html5QrCode) html5QrCode = new Html5Qrcode("reader");

        await html5QrCode.start(
            { facingMode: "environment" },
            {
                fps: 30,
                qrbox: (w, h)=>({
                    width: Math.floor(w * 0.9),
                    height: Math.floor(h * 0.6)
                }),
                aspectRatio: 1.777778
            },
            decodedText=>{
                if(processing) return;
                processing = true;
                detectFeedback();
                simpanLokal(decodedText);
                setTimeout(()=>{ processing = false; }, SCAN_CONFIG.processingDelay);
            }
        );

        cameraRunning = true;

        try{
            const video = document.querySelector("#reader video");
            if(video && video.srcObject){
                const tracks = video.srcObject.getVideoTracks();
                if(tracks.length) cameraTrack = tracks[0];
            }
        }catch(e){
            console.log("Camera track tidak ditemukan", e);
        }

        flashOn = false;
        updateFlashButton();

        btn.disabled = false;
        btn.className = "header-btn camera-on";
        btn.innerText = "KAMERA ON";
        overlay.style.display = "none";

        setStatus("green", ROBOT_CONFIG.pesan.kameraAktif);
        speak(ROBOT_CONFIG.pesan.kameraAktif);

    }catch(error){
        console.error("CAMERA ERROR", error);

        cameraRunning = false;
        cameraTrack = null;
        flashOn = false;
        updateFlashButton();

        btn.disabled = false;
        btn.className = "header-btn camera-off";
        btn.innerText = "KAMERA OFF";
        overlay.style.display = "flex";

        setStatus("red", ROBOT_CONFIG.pesan.kameraGagal);
        showNotif("IZINKAN AKSES KAMERA", "error");
        speak(ROBOT_CONFIG.pesan.kameraGagal);
    }
}

async function stopCamera(){
    if(!cameraRunning) return;
    cameraRunning = false;

    try{
        if(cameraTrack){
            await cameraTrack.applyConstraints({ advanced: [{ torch: false }] });
        }
    }catch(e){}

    flashOn = false;
    cameraTrack = null;
    updateFlashButton();

    const btn = document.getElementById("cameraToggle");
    const overlay = document.getElementById("cameraOverlay");

    try{
        if(html5QrCode) await html5QrCode.stop();
    }catch(e){}

    btn.className = "header-btn camera-off";
    btn.innerText = "KAMERA OFF";
    overlay.style.display = "flex";

    setStatus("yellow", ROBOT_CONFIG.pesan.kameraBerhenti);
}

/* =========================================================
   FLASH
========================================================= */

async function toggleFlash(){
    if(!cameraRunning){
        showNotif("KAMERA BELUM AKTIF", "warning");
        return;
    }

    if(!cameraTrack){
        try{
            const video = document.querySelector("#reader video");
            if(video && video.srcObject){
                const tracks = video.srcObject.getVideoTracks();
                if(tracks.length) cameraTrack = tracks[0];
            }
        }catch(e){}
    }

    if(!cameraTrack){
        showNotif("KAMERA TIDAK TERDETEKSI", "error");
        return;
    }

    try{
        const cap = cameraTrack.getCapabilities ? cameraTrack.getCapabilities() : {};

        if(!cap.torch){
            showNotif("FLASH TIDAK DIDUKUNG HP INI", "warning");
            speak("Flash tidak didukung");
            return;
        }

        flashOn = !flashOn;
        await cameraTrack.applyConstraints({ advanced: [{ torch: flashOn }] });
        updateFlashButton();

        if(flashOn){
            beep(850, .08);
            setStatus("green", "FLASH ON • KAMERA AKTIF");
            showNotif("FLASH ON", "success");
        }else{
            setStatus("green", "FLASH OFF • KAMERA AKTIF");
            showNotif("FLASH OFF", "warning");
        }

    }catch(error){
        console.error("FLASH ERROR:", error);
        flashOn = false;
        updateFlashButton();
        showNotif("FLASH TIDAK BISA DIGUNAKAN", "error");
    }
}

function updateFlashButton(){
    const btn = document.getElementById("flashToggle");
    if(!btn) return;
    btn.disabled = !cameraRunning;
    if(flashOn){
        btn.className = "header-btn flash-on";
        btn.innerText = "FLASH ON";
    }else{
        btn.className = "header-btn flash-off";
        btn.innerText = "FLASH OFF";
    }
}

/* =========================================================
   ANTREAN
========================================================= */

function openQueue(){
    renderQueue();
    document.getElementById("queueModal").classList.add("open");
}

function renderQueue(){
    const list = document.getElementById("queueList");
    list.innerHTML = "";

    if(localData.length === 0){
        list.innerHTML = '<div class="empty">Antrean kosong</div>';
        return;
    }

    localData.forEach((resi, i)=>{
        const e = getEkspedisi(resi) || "-";
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
            <div class="item-main">
                <div class="item-resi">${escapeHTML(resi)}</div>
                <div class="item-meta">${escapeHTML(e)} • antrean #${i+1}</div>
            </div>
            <button class="item-delete" data-resi="${escapeHTML(resi)}">HAPUS</button>
        `;
        list.appendChild(div);
    });
}

document.getElementById("queueList").addEventListener("click", e=>{
    const btn = e.target.closest(".item-delete");
    if(!btn) return;
    removeFromQueue(btn.dataset.resi);
});

// Hapus dari antrean + hapus catatan "ANTREAN"-nya di riwayat, supaya resi bisa discan ulang
function removeFromQueue(resi){
    const r = normalizeResi(resi);
    if(!confirm(`Hapus ${r} dari antrean?`)) return;

    localData = localData.filter(x => normalizeResi(x) !== r);
    scanHistory = scanHistory.filter(x => !(normalizeResi(x.resi) === r && x.status === "ANTREAN"));

    saveData();
    updateUI();
    renderQueue();
    renderHistory();
    updateStats();
    showNotif("RESI DIHAPUS DARI ANTREAN", "success");
}

function clearQueue(){
    if(localData.length === 0){
        showNotif("ANTREAN SUDAH KOSONG", "warning");
        return;
    }
    if(!confirm(`Kosongkan ${localData.length} resi di antrean?\n\nResi yang belum disinkron tidak akan masuk sheet.`)) return;

    const set = new Set(localData.map(normalizeResi));
    scanHistory = scanHistory.filter(x => !(set.has(normalizeResi(x.resi)) && x.status === "ANTREAN"));
    localData = [];

    saveData();
    updateUI();
    renderQueue();
    renderHistory();
    updateStats();
    showNotif("ANTREAN DIKOSONGKAN", "success");
}

/* =========================================================
   RIWAYAT
========================================================= */

function openHistory(){
    document.getElementById("historyModal").classList.add("open");
    renderHistory();
}

function badgeClass(status){
    switch(status){
        case "ANTREAN": return "antrean";
        case "TERKIRIM": return "terkirim";
        case "DOUBLE": return "double";
        case "INVALID": return "invalid";
        default: return "";
    }
}

function renderHistory(){
    const list = document.getElementById("historyList");
    const search = normalizeResi(document.getElementById("historySearch")?.value || "");

    list.innerHTML = "";

    let data = scanHistory;
    if(search){
        data = data.filter(x => normalizeResi(x.resi).includes(search));
    }

    if(data.length === 0){
        list.innerHTML = '<div class="empty">Riwayat kosong</div>';
        return;
    }

    // Batasi render agar tetap ringan di HP
    data.slice(0, 300).forEach(item=>{
        const div = document.createElement("div");
        div.className = "item";
        const st = item.status || "";
        div.innerHTML = `
            <div class="item-main">
                <div class="item-resi">${escapeHTML(item.resi)}</div>
                <div class="item-meta">
                    ${escapeHTML(item.ekspedisi || "-")} • ${escapeHTML(formatDateTime(item.waktu))}
                    ${st ? `<span class="badge ${badgeClass(st)}">${escapeHTML(st)}</span>` : ""}
                </div>
            </div>
            <button class="item-delete" data-resi="${escapeHTML(item.resi)}">HAPUS</button>
        `;
        list.appendChild(div);
    });
}

document.getElementById("historyList").addEventListener("click", e=>{
    const btn = e.target.closest(".item-delete");
    if(!btn) return;

    const r = normalizeResi(btn.dataset.resi);
    if(!confirm(`Hapus riwayat ${r}?\n\nData di Google Sheet TIDAK ikut terhapus.`)) return;

    const queued = scanHistory.find(x => normalizeResi(x.resi) === r && x.status === "ANTREAN");
    if(queued){
        localData = localData.filter(x => normalizeResi(x) !== r);
    }
    scanHistory = scanHistory.filter(x => normalizeResi(x.resi) !== r);

    saveData();
    updateUI();
    renderQueue();
    renderHistory();
    updateStats();
    showNotif("RIWAYAT DIHAPUS", "success");
});

function deleteAllHistory(){
    if(scanHistory.length === 0){
        showNotif("RIWAYAT SUDAH KOSONG", "warning");
        return;
    }
    if(!confirm("Hapus SEMUA riwayat scan di HP?\n\nResi yang masih di antrean tetap aman.\nData di Google Sheet TIDAK akan dihapus.")) return;

    // Resi yang masih di antrean tetap dicatat di riwayat
    const set = new Set(localData.map(normalizeResi));
    scanHistory = scanHistory.filter(x => set.has(normalizeResi(x.resi)) && x.status === "ANTREAN");

    saveData();
    renderHistory();
    updateStats();
    showNotif("RIWAYAT DIHAPUS", "success");
}

/* =========================================================
   SYNC KE SHEET
========================================================= */

function markHistory(resi, status, serverResult){
    const r = normalizeResi(resi);
    const item = scanHistory.find(x => normalizeResi(x.resi) === r && x.status === "ANTREAN");
    if(!item) return;

    item.status = status;
    item.syncTime = new Date().toISOString();
    if(serverResult && serverResult.message){
        item.serverMessage = serverResult.message;
    }
}

async function syncKeServer(){
    if(syncSedangBerjalan){
        showNotif("SYNC SEDANG BERJALAN", "warning");
        return;
    }

    if(localData.length === 0){
        setStatus("yellow", ROBOT_CONFIG.pesan.antreanKosong);
        showNotif("ANTREAN KOSONG", "warning");
        speak(ROBOT_CONFIG.pesan.antreanKosong);
        return;
    }

    const url = getTargetUrl();
    if(!url){
        setStatus("red", "URL Apps Script tidak ditemukan");
        showNotif("APP_URL TIDAK DITEMUKAN", "error");
        alert("APP_URL tidak ditemukan dari config.js");
        return;
    }

    syncSedangBerjalan = true;

    const btnSync = document.getElementById("syncButton");
    btnSync.disabled = true;
    btnSync.style.opacity = "0.6";
    btnSync.style.pointerEvents = "none";

    const daftar = [...localData];
    const total = daftar.length;

    setStatus("yellow", `Sync ${total} resi...`);
    speak(ROBOT_CONFIG.pesan.syncMulai);

    try{
        const response = await fetch(url, {
            method: "POST",
            mode: "cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ source: SOURCE_NAME, resi: daftar })
        });

        if(!response.ok) throw new Error("HTTP " + response.status);

        const text = await response.text();
        let result;
        try{
            result = JSON.parse(text);
        }catch(e){
            console.error("Response server:", text);
            throw new Error("Response server tidak valid");
        }

        if(result.status === "error"){
            throw new Error(result.message || "Server error");
        }

        const results = Array.isArray(result.results) ? result.results : [];
        if(results.length === 0){
            throw new Error("Server tidak mengirim hasil per resi");
        }

        let berhasil = 0, duplicate = 0, invalid = 0, gagal = 0;
        const tetapDiAntrean = new Set();

        results.forEach(item=>{
            if(!item || !item.resi) return;

            if(item.status === "success"){
                berhasil++;
                markHistory(item.resi, "TERKIRIM", item);
            }else if(item.status === "duplicate"){
                duplicate++;
                markHistory(item.resi, "DOUBLE", item);
            }else if(item.status === "invalid"){
                invalid++;
                markHistory(item.resi, "INVALID", item);
            }else{
                // error / failed / status lain: tetap di antrean, coba sync lagi nanti
                gagal++;
                tetapDiAntrean.add(normalizeResi(item.resi));
            }
        });

        // Resi yang tidak muncul di hasil server juga dipertahankan di antrean
        const dikembalikan = new Set(results.map(x => normalizeResi(x && x.resi)));
        daftar.forEach(r=>{
            if(!dikembalikan.has(normalizeResi(r))) tetapDiAntrean.add(normalizeResi(r));
        });

        localData = localData.filter(r => tetapDiAntrean.has(normalizeResi(r)));

        saveData();
        updateUI();
        renderQueue();
        renderHistory();
        updateStats();

        if(gagal > 0 && berhasil === 0 && duplicate === 0){
            setStatus("red", `Sync gagal • ${gagal} resi`);
            showNotif(`SYNC GAGAL • ${gagal} RESI`, "error");
            speak(ROBOT_CONFIG.pesan.syncGagal);
        }else if(berhasil > 0 && (duplicate > 0 || invalid > 0 || gagal > 0)){
            const info = [];
            if(duplicate) info.push(`${duplicate} double`);
            if(invalid) info.push(`${invalid} tidak valid`);
            if(gagal) info.push(`${gagal} gagal`);
            setStatus("yellow", `Sync selesai • ${berhasil} berhasil • ${info.join(" • ")}`);
            showNotif(`✓ ${berhasil} BERHASIL • ${info.join(" • ").toUpperCase()}`, "warning");
            speak(`${berhasil} ${ROBOT_CONFIG.pesan.syncBerhasil}, ${info.join(", ")}`);
        }else if(berhasil > 0){
            setStatus("green", `Sync selesai • ${berhasil} berhasil`);
            showNotif(`✓ ${berhasil} RESI TERSINKRON`, "success");
            speak(`${berhasil} ${ROBOT_CONFIG.pesan.syncBerhasil}`);
        }else if(duplicate > 0){
            setStatus("red", `${duplicate} RESI DOUBLE DARI SERVER`);
            showNotif(`${duplicate} RESI DOUBLE`, "error");
            speak(`${duplicate} resi terdeteksi double oleh server`);
        }else if(invalid > 0){
            setStatus("red", `${invalid} RESI TIDAK VALID`);
            showNotif(`${invalid} RESI TIDAK VALID`, "error");
            speak(`${invalid} resi tidak valid`);
        }

    }catch(error){
        console.error("SYNC ERROR:", error);
        setStatus("red", "Sinkronisasi gagal");
        showNotif("SYNC GAGAL: " + error.message, "error");
        speak(ROBOT_CONFIG.pesan.syncGagal);

    }finally{
        syncSedangBerjalan = false;
        btnSync.disabled = false;
        btnSync.style.opacity = "";
        btnSync.style.pointerEvents = "";
        updateUI();
    }
}

/* =========================================================
   MODAL
========================================================= */

function closeModal(id){
    document.getElementById(id).classList.remove("open");
}

function closeModalOutside(e, id){
    if(e.target.id === id) closeModal(id);
}

/* =========================================================
   UTIL
========================================================= */

function escapeHTML(text){
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

document.addEventListener("touchmove", e=>{
    if(!e.target.closest(".sheet-body")) e.preventDefault();
}, { passive: false });
</script>
